<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#30483a">
<title>우리집 생물 기록지</title>
<style>
:root{--ink:#1d1a17;--paper:#fffdf8;--bg:#efe9df;--line:#d9d2c6;--mut:#6b625a;--blue:#1d4ed8;--blueL:#e8eefc;--amb:#e08a00;--ambL:#fff4e0;--ambD:#8a4600}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Noto Sans KR","Malgun Gothic",sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.wrap{max-width:1100px;margin:0 auto;padding:0 12px calc(86px + env(safe-area-inset-bottom))}
header.top{position:sticky;top:0;z-index:20;background:var(--bg);padding:10px 12px 8px;display:flex;align-items:center;gap:8px;max-width:1100px;margin:0 auto}
header.top h1{font-size:18px;margin:0;flex:1;letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip{display:inline-flex;align-items:center;gap:4px;border:1.5px solid var(--ink);border-radius:999px;padding:3px 10px;font-size:13px;font-weight:700;background:#fff;white-space:nowrap}
.chip.sync.ok{border-color:var(--blue);color:var(--blue)}
.chip.sync.warn{border-color:var(--amb);color:var(--ambD);background:var(--ambL)}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--ink);display:flex;justify-content:center;padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
nav.tabs button{flex:1;max-width:180px;background:none;border:0;color:#cfc8bd;font-size:12px;font-weight:700;padding:6px 2px;border-radius:10px;display:flex;flex-direction:column;align-items:center;gap:2px}
nav.tabs button b{font-size:20px;line-height:1}
nav.tabs button[aria-current=page]{background:#fff;color:var(--ink)}
.card{background:var(--paper);border:2px solid var(--ink);border-radius:14px;padding:12px;margin:10px 0}
h2.sec{font-size:17px;margin:16px 2px 6px;display:flex;align-items:baseline;gap:8px}
h2.sec small{font-size:13px;color:var(--mut);font-weight:600}
.mut{color:var(--mut)}
.btn{border:2px solid var(--ink);background:#fff;border-radius:10px;padding:8px 12px;font-weight:800}
.btn.pri{background:var(--blue);border-color:var(--blue);color:#fff}
.btn.dark{background:var(--ink);color:#fff}
.btn.sm{padding:4px 9px;font-size:13px;border-width:1.5px}
.btn:disabled{opacity:.45}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
/* 선반 */
.shelves{display:grid;grid-template-columns:1fr;gap:6px}
@media(min-width:900px){.shelves{grid-template-columns:repeat(3,1fr);gap:14px}.shelf.floor{grid-column:1/-1}.shelf.floor .tubs{grid-template-columns:repeat(4,1fr)}}
.shelf h3{margin:10px 0 6px;background:var(--ink);color:#fff;border-radius:10px;padding:7px 12px;font-size:16px;display:flex;align-items:baseline;gap:8px}
.shelf h3 small{font-weight:600;font-size:12.5px;color:#d9d2c6}
.tubs{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
@media(min-width:900px){.tubs{grid-template-columns:1fr}}
.tub{display:flex;flex-direction:column;text-align:left;background:var(--paper);border:2px solid var(--ink);border-radius:12px;overflow:hidden;padding:0}
.tub img{width:100%;aspect-ratio:4/3;object-fit:cover;display:block;background:#2a1c13}
.tub .tb{padding:7px 9px 9px;min-width:0;flex:1}
.tub .tn{font-weight:900;font-size:16px;letter-spacing:-.02em}
.tub .tl{font-style:italic;font-size:11.5px;color:var(--mut);line-height:1.25;border-bottom:1px solid var(--line);padding-bottom:3px;margin-bottom:4px}
.tub .te{font-weight:800;font-size:12.5px}
.st{display:flex;flex-wrap:wrap;gap:4px;margin-top:5px}
.st span{font-size:11.5px;font-weight:700;border-radius:6px;padding:1px 6px;background:var(--blueL);color:var(--blue);white-space:nowrap}
.st span.due{background:var(--ambL);color:var(--ambD);outline:1.5px solid var(--amb)}
@media(min-width:900px){.tubs .tub{flex-direction:row;align-items:stretch}.tubs .tub img{width:42%;aspect-ratio:auto;height:auto;min-height:100%;flex:none}}
/* 오늘 */
.todo{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.todo:first-of-type{border-top:0}
.todo img{width:54px;height:42px;object-fit:cover;border-radius:8px;border:1.5px solid var(--ink);flex:none}
.todo .ti{flex:1;min-width:0}
.todo .ti b{display:block;font-size:15px}
.todo .ti small{color:var(--mut)}
.qb{border:2px solid var(--ink);background:#fff;border-radius:10px;min-width:46px;height:42px;font-size:13px;font-weight:800;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.05;padding:0 6px}
.qb.done{background:var(--blue);border-color:var(--blue);color:#fff}
.feed{list-style:none;margin:0;padding:0}
.feed li{display:flex;gap:9px;padding:8px 0;border-top:1px solid var(--line);align-items:flex-start}
.feed li:first-child{border-top:0}
.feed .ic{font-size:20px;width:26px;text-align:center;flex:none}
.feed .fx{flex:1;min-width:0}
.feed .fx b{font-weight:800}
.feed .fx small{color:var(--mut);display:block}
.feed .who{font-size:11.5px;font-weight:800;border:1.5px solid var(--ink);border-radius:6px;padding:0 5px;margin-left:4px}
.feed .who.me{background:var(--blue);border-color:var(--blue);color:#fff}
.feed .thumb{width:56px;height:42px;object-fit:cover;border-radius:6px;border:1.5px solid var(--ink)}
.feed .del{border:0;background:none;color:var(--mut);font-size:13px;padding:2px 4px}
.day{font-weight:900;font-size:14px;margin:14px 2px 2px;color:var(--mut)}
.filters{display:flex;gap:6px;overflow-x:auto;padding:2px 0 6px;scrollbar-width:none}
.filters button{flex:none;border:1.5px solid var(--ink);background:#fff;border-radius:999px;padding:4px 11px;font-size:13px;font-weight:700}
.filters button[aria-pressed=true]{background:var(--ink);color:#fff}
/* 상세 */
.detail{position:fixed;inset:0;z-index:40;background:var(--bg);overflow-y:auto;-webkit-overflow-scrolling:touch}
.detail .dh{position:sticky;top:0;z-index:2;background:var(--bg);display:flex;align-items:center;gap:8px;padding:10px 12px;max-width:760px;margin:0 auto}
.detail .dh h2{margin:0;font-size:19px;flex:1}
.detail .dbody{max-width:760px;margin:0 auto;padding:0 12px 40px}.growth{padding:10px 12px}.growth-head{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-bottom:7px}.growth-list{list-style:none;margin:0;padding:0 0 0 5px}.growth-list li{display:grid;grid-template-columns:22px 1fr;gap:7px;position:relative;padding:6px 0 8px;border-left:2px solid var(--line);margin-left:7px}.growth-list li:last-child{border-left-color:transparent}.growth-list .gic{width:20px;height:20px;border:1.5px solid var(--ink);border-radius:50%;background:var(--paper);display:flex;align-items:center;justify-content:center;font-size:11px;margin-left:-11px;z-index:1}.growth-list .gtxt{min-width:0}.growth-list .gtxt b{font-size:13.5px}.growth-list .gtxt small{display:block;color:var(--mut);font-size:12px;overflow-wrap:anywhere}.growth-empty{font-size:13px;color:var(--mut);padding:4px 0}
.hero{display:grid;grid-template-columns:1fr;gap:10px}
@media(min-width:700px){.hero{grid-template-columns:1fr 1fr}}
.hero img{width:100%;border-radius:12px;border:2px solid var(--ink);display:block;aspect-ratio:4/3;object-fit:cover}
.hcov{position:relative}.hcb{position:absolute;right:8px;bottom:8px;background:rgba(20,16,12,.82);color:#fff;border:2px solid #fff;border-radius:999px;padding:6px 12px;font-weight:800;font-size:13px}
.viewer{border:2px solid var(--ink);border-radius:12px;overflow:hidden;background:#f2efe9;position:relative}
.viewer canvas{display:block;width:100%;image-rendering:pixelated;image-rendering:crisp-edges;touch-action:manipulation}
.viewer .vt{display:flex;border-bottom:2px solid var(--ink)}
.viewer .vt button{flex:1;border:0;background:#fff;padding:7px;font-weight:800;font-size:13.5px}
.viewer .vt button[aria-pressed=true]{background:var(--ink);color:#fff}
.viewer .vm{position:absolute;left:8px;right:8px;bottom:8px;background:rgba(29,26,23,.85);color:#fff;border-radius:8px;padding:4px 8px;font-size:12.5px;text-align:center;pointer-events:none;opacity:0;transition:opacity .2s}
.viewer .vm.on{opacity:1}
.viewer .vh{font-size:12px;color:var(--mut);padding:4px 8px;background:#fff;border-top:1px solid var(--line)}
.acts{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:10px 0}
.acts button{border:2px solid var(--ink);background:#fff;border-radius:12px;padding:8px 2px;font-weight:800;font-size:12.5px;display:flex;flex-direction:column;align-items:center;gap:2px}
.acts button b{font-size:22px;line-height:1.1}
.acts button.hl{background:var(--blue);border-color:var(--blue);color:#fff}
dl.info{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;margin:0}
dl.info dt{color:var(--mut);font-weight:700;font-size:13.5px}
dl.info dd{margin:0;font-weight:700}
.ok{color:var(--blue)}.warn{color:var(--ambD)}
.album{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
@media(min-width:600px){.album{grid-template-columns:repeat(6,1fr)}}
.album button{padding:0;border:1.5px solid var(--ink);border-radius:8px;overflow:hidden;background:#000;aspect-ratio:1}
.album img{width:100%;height:100%;object-fit:cover;display:block}
/* 시트 */
.sheet{position:fixed;inset:0;z-index:60;background:rgba(29,26,23,.55);display:flex;align-items:flex-end;justify-content:center}
.sheet .sb{background:var(--paper);width:100%;max-width:520px;border-radius:18px 18px 0 0;border:2px solid var(--ink);border-bottom:0;padding:14px 14px calc(16px + env(safe-area-inset-bottom));max-height:88vh;overflow:auto;animation:up .18s ease-out}
@media(min-width:600px){.sheet{align-items:center}.sheet .sb{border-radius:18px;border-bottom:2px solid var(--ink)}}
@keyframes up{from{transform:translateY(30px);opacity:.4}}
.sheet h3{margin:0 0 10px;font-size:18px}
.sheet label{display:block;font-weight:800;font-size:13.5px;margin:10px 0 4px}
.sheet input,.sheet textarea,.sheet select{width:100%;border:2px solid var(--ink);border-radius:10px;padding:9px 10px;background:#fff}
.sheet textarea{min-height:76px;resize:vertical}
.step{display:flex;align-items:center;gap:8px}
.step button{width:48px;height:46px;border:2px solid var(--ink);border-radius:10px;background:#fff;font-size:22px;font-weight:900}
.step input{text-align:center;font-size:22px;font-weight:900}
.sheet .sbb{display:flex;gap:8px;margin-top:14px}
.sheet .sbb .btn{flex:1;padding:11px}
.big{font-size:17px;padding:13px}
.who-pick{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.who-pick button{padding:16px;font-size:18px}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:80;background:var(--ink);color:#fff;border-radius:12px;padding:9px 12px;font-weight:700;font-size:14px;display:flex;gap:10px;align-items:center;max-width:92vw;box-shadow:0 6px 18px rgba(0,0,0,.25)}
.toast button{white-space:nowrap;flex:none;background:#fff;color:var(--ink);border:0;border-radius:8px;padding:4px 9px;font-weight:800}
.photoview{position:fixed;inset:0;z-index:90;background:rgba(0,0,0,.92);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:14px;color:#fff}
.photoview img{max-width:100%;max-height:78vh;border-radius:10px}
.photoview p{margin:10px 0 0;font-size:14px;text-align:center}
.welcome{max-width:520px;margin:8vh auto 0;text-align:center}
.welcome h1{font-size:26px;margin:10px 0}
.empty{text-align:center;color:var(--mut);padding:18px 6px}
code.k{font-size:12px;word-break:break-all;background:#fff;border:1.5px dashed var(--ink);border-radius:8px;padding:6px 8px;display:block;margin:6px 0}
pre.sql{white-space:pre-wrap;font-size:11.5px;background:#fff;border:1.5px solid var(--line);border-radius:8px;padding:8px;max-height:260px;overflow:auto}
details summary{cursor:pointer;font-weight:800}
.kv{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-top:1px solid var(--line)}
.kv:first-child{border-top:0}
.ro .edonly,.ro [data-q],.ro [data-bulk],.ro [data-start],.ro [data-del],.ro .acts{display:none!important}
.login input{width:100%;border:2px solid var(--ink);border-radius:10px;padding:8px 10px;margin:4px 0 8px;background:#fff}
.hub{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:14px 0}
.hub button{background:var(--paper);border:3px solid var(--ink);border-radius:18px;min-height:190px;padding:16px 10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;text-align:center;box-shadow:0 4px 0 var(--ink)}
.hub button:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.hub .he{font-size:64px;line-height:1}
.hub .hn{font-size:21px;font-weight:900;letter-spacing:-.03em}
.hub .hs{font-size:13px;font-weight:700;color:var(--mut)}
.hub .soon{opacity:.6;border-style:dashed;box-shadow:none}
.hub .soon .hs{border:1.5px solid var(--mut);border-radius:999px;padding:1px 8px}
@media(min-width:720px){.hub{grid-template-columns:repeat(4,1fr)}.hub button{min-height:230px}}
.shv{display:flex;flex-direction:column;gap:6px;margin-top:6px}
.sh2 .shl{display:flex;align-items:baseline;gap:8px;padding:0 2px 3px;height:22px}
.sh2 .shl b{font-size:15px}.sh2 .shl small{font-size:12px;color:var(--mut);font-weight:700}
.stk{display:flex;flex-wrap:wrap-reverse;gap:4px;padding-bottom:4px;border-bottom:6px solid var(--ink);border-radius:0 0 3px 3px}
.sh2.floor .stk{border-bottom-style:double;border-bottom-width:7px}
.tb2{position:relative;width:var(--tw,90px);aspect-ratio:4/3;padding:0;border:2px solid var(--ink);border-radius:8px;overflow:hidden;background:#2a1c13}
.tb2 img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.tb2 span{position:absolute;left:0;right:0;top:0;background:rgba(20,16,12,.78);color:#fff;font-weight:800;font-size:clamp(10.5px,calc(var(--tw,90px)*.125),15px);line-height:1.2;padding:2px 4px 3px;text-align:center;letter-spacing:-.03em;word-break:keep-all}
.shh{display:flex;align-items:center;gap:8px;margin:6px 2px 0;min-height:32px}
.shh b{font-size:16px}.shh small{color:var(--mut);font-weight:700;font-size:12.5px}.shh .btn{margin-left:auto}
.tb2 .ck{display:none}
#shv .tb2[data-open]{touch-action:pan-y;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}#shv .tb2[data-open] img{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none;-webkit-user-drag:none;pointer-events:none}#shv .tb2.swap-pick{outline:4px solid var(--blue);outline-offset:2px}
.rm .shl{cursor:pointer;text-decoration:underline dotted}
.rm .tb2.on{outline:4px solid var(--ink);outline-offset:-4px}
.rm .tb2.on img{opacity:.4}
.rm .tb2.on .ck{display:flex;position:absolute;right:4px;bottom:4px;width:28px;height:28px;border-radius:50%;background:#fff;border:2.5px solid var(--ink);font-style:normal;font-weight:900;align-items:center;justify-content:center;font-size:17px}
.rmbar{position:fixed;left:0;right:0;bottom:64px;z-index:25;background:var(--paper);border-top:2px solid var(--ink);display:flex;align-items:center;gap:8px;padding:8px 12px;justify-content:center}
.rmbar span{font-weight:800;margin-right:auto;max-width:520px}.rmbar .btn[disabled]{opacity:.4}
.kpick{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:5px}.kpick button{min-width:0}.rhint{font-size:12.5px;color:var(--mut);margin:7px 2px 4px;min-height:18px}
.kpick button{border:2px solid var(--ink);background:#fff;border-radius:12px;padding:9px 1px;font-weight:800;font-size:12.5px;word-break:keep-all;display:flex;flex-direction:column;align-items:center;gap:2px}
.kpick button b{font-size:24px;line-height:1.1}.kpick button[aria-pressed=true]{background:var(--ink);color:#fff}
.nrow{display:flex;align-items:center;gap:8px;padding:5px 0;border-top:1px solid var(--line)}.nrow:first-child{border-top:0}
.nrow>span{flex:1;font-weight:800;min-width:0}.nrow .step{gap:5px}.sheet .nrow .step input{width:64px;padding:6px 2px;font-size:18px}.nrow .step button{width:38px;height:38px;font-size:19px}
.tubf{display:flex;gap:6px;overflow-x:auto;padding:2px 2px 8px}
.tubf button{flex:none;width:72px;border:2px solid var(--ink);border-radius:10px;background:#fff;padding:0;overflow:hidden;font-size:11.5px;font-weight:800}
.tubf img{width:100%;height:46px;object-fit:cover;display:block}
.tubf span{display:block;padding:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tubf button[aria-pressed=true]{outline:3px solid var(--ink);outline-offset:1px}.tubf button[aria-pressed=true] span{background:var(--ink);color:#fff}
.tubf .all{min-height:68px;font-size:13px}
.seg{display:flex;border:2px solid var(--ink);border-radius:10px;overflow:hidden;flex:none}
.seg button{border:0;background:#fff;padding:5px 10px;font-weight:800;font-size:13px;white-space:nowrap}
.seg button+button{border-left:2px solid var(--ink)}.seg button[aria-pressed=true]{background:var(--ink);color:#fff}
.rmh{margin:4px 2px 0;font-size:12.5px;color:var(--mut);font-weight:700}
.shv.shelf{margin-left:auto;margin-right:auto;width:100%}
.cols{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.col{display:flex;flex-direction:column;min-width:0}
.shv.shelf .shl{display:flex;flex-direction:column;align-items:flex-start;gap:0;height:auto;line-height:1.15;padding:0 2px 4px}
.shv.shelf .shl small{font-size:11px}
.stk2{flex:1;display:flex;flex-direction:column;justify-content:flex-end;gap:4px;padding-bottom:4px;border-bottom:6px solid var(--ink)}
.shv.shelf .tb2{width:100%;height:var(--th,64px);aspect-ratio:auto}
.flr{margin-top:8px}.flr .shl{flex-direction:row!important;align-items:baseline!important;gap:8px!important}
.frow{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;padding-bottom:4px;border-bottom:7px double var(--ink)}
.shv.tax .shl b i{font-weight:900}
.dmbar{display:flex;margin:6px 0 4px;max-width:520px}
.dmbar button{flex:1;padding:7px 2px;font-size:12.5px}
.dm-photo .tb2 span{display:none}
.tb2 em.cnt{display:none}
.dm-cnt .tb2 span{display:none}
.dm-cnt .tb2 em.cnt{display:block;position:absolute;left:0;right:0;top:0;background:rgba(20,16,12,.78);color:#fff;font-style:normal;font-weight:900;font-size:clamp(11px,calc(var(--tw,90px)*.14),17px);line-height:1.2;padding:2px 4px 3px;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dm-cnt .tb2 em.cnt small{font-size:.8em;font-weight:800}
.sg.sg4{grid-template-columns:repeat(4,1fr)}.sg.sg4 button{font-size:12.5px;letter-spacing:-.04em}
.dm-name .tb2{background:var(--paper)}
.dm-name .tb2 img{display:none}
.dm-name .tb2 small.mut{display:none}
.dm-name .tb2 span{inset:0;bottom:0;background:none;color:var(--ink);display:flex;align-items:center;justify-content:center;font-size:clamp(12px,calc(var(--tw,90px)*.15),19px);padding:2px 4px}
.shv.shelf.dm-name .tb2 span{font-size:clamp(13px,calc(var(--th,60px)*.3),19px)}
.wi{display:flex;gap:11px;padding:10px 0;border-top:1px solid var(--line);align-items:flex-start}.wi:first-child{border-top:0}
.wt{width:88px;height:66px;object-fit:cover;border-radius:9px;border:2px solid var(--ink);flex:none;cursor:pointer;background:#2a1c13}
.wx{flex:1;min-width:0}.w1{display:flex;align-items:center;gap:6px}.w1 b{font-size:16px;cursor:pointer;letter-spacing:-.02em}
.w1 .wtime{margin-left:auto;color:var(--mut);font-size:13px;font-weight:700}

const SQL="-- 우리집 등각류 기록지 · Supabase 설정 (SQL Editor에 붙여 넣고 Run 한 번)\n-- 누구나 볼 수 있고, 기록·수정·삭제는 등록된 계정(iso_editor)만 할 수 있어요.\ncreate table if not exists iso_log(\n  cid text primary key,\n  fam text not null,\n  tub text not null,\n  who text,\n  kind text not null,\n  val jsonb,\n  note text,\n  at timestamptz not null default now(),\n  del boolean not null default false,\n  upd timestamptz not null default now()\n);\ncreate index if not exists iso_log_fam_upd on iso_log(fam, upd);\n\ncreate table if not exists iso_photo(\n  cid text primary key,\n  fam text not null,\n  tub text not null,\n  who text,\n  note text,\n  thumb text not null,\n  data text not null,\n  at timestamptz not null default now(),\n  del boolean not null default false,\n  upd timestamptz not null default now()\n);\ncreate index if not exists iso_photo_fam_upd on iso_photo(fam, upd);\n\n-- 공개할 기록지(지금까지 쓰던 기록지)와 기록할 수 있는 사람 목록\ncreate table if not exists iso_cfg(id int primary key default 1 check (id = 1), fam text not null);\ncreate table if not exists iso_editor(email text primary key, name text not null);\n\n-- 표에 직접 접근은 막고, 아래 함수로만 읽고 쓰게 해요\nalter table iso_log enable row level security;\nalter table iso_photo enable row level security;\nalter table iso_cfg enable row level security;\nalter table iso_editor enable row level security;\n\n-- 지금까지 쓰던 기록지(기록이 가장 많은 것)를 공개 기록지로 정해요\ninsert into iso_cfg(id, fam)\nselect 1, fam from (\n  select fam, count(*) n from iso_log group by fam\n  union all\n  select fam, count(*) n from iso_photo group by fam\n) t group by fam order by sum(n) desc limit 1\non conflict (id) do nothing;\ninsert into iso_cfg(id, fam) values (1, 'home') on conflict (id) do nothing;\n\ncreate or replace function iso_fam() returns text\nlanguage sql stable security definer set search_path = public as $$\n  select fam from iso_cfg where id = 1;\n$$;\n\n-- 로그인한 계정이 기록 권한이 있으면 이름(나/아빠)을, 없으면 null을 돌려줘요\ncreate or replace function iso_me() returns text\nlanguage sql stable security definer set search_path = public as $$\n  select name from iso_editor\n  where coalesce(auth.jwt()->>'role', '') = 'authenticated'\n    and lower(email) = lower(coalesce(auth.jwt()->>'email', ''));\n$$;\n\ncreate or replace function iso_whoami() returns text\nlanguage sql stable security definer set search_path = public as $$\n  select iso_me();\n$$;\n\n-- 보기 (누구나)\ncreate or replace function iso_view(since timestamptz default '1970-01-01')\nreturns json language plpgsql stable security definer set search_path = public as $$\ndeclare f text := iso_fam();\nbegin\n  return json_build_object(\n    'logs', (select coalesce(json_agg(l order by l.upd), '[]'::json) from\n             (select cid, tub, who, kind, val, note, at, del, upd from iso_log where fam = f and upd > since) l),\n    'photos', (select coalesce(json_agg(p order by p.upd), '[]'::json) from\n             (select cid, tub, who, note, thumb, at, del, upd from iso_photo where fam = f and upd > since) p),\n    'now', now());\nend $$;\n\ncreate or replace function iso_view_photo(id text) returns text\nlanguage sql stable security definer set search_path = public as $$\n  select data from iso_photo where fam = iso_fam() and cid = id and not del;\n$$;\n\n-- 기록·사진·삭제 (등록된 계정만)\ncreate or replace function iso_write(items json) returns int\nlanguage plpgsql security definer set search_path = public as $$\ndeclare x json; n int := 0; me text := iso_me(); f text := iso_fam();\nbegin\n  if me is null then raise exception 'not allowed' using errcode = '42501'; end if;\n  for x in select * from json_array_elements(items) loop\n    insert into iso_log(cid, fam, tub, who, kind, val, note, at)\n    values (x->>'cid', f, x->>'tub', me, x->>'kind', x->'val', left(x->>'note', 2000),\n            coalesce((x->>'at')::timestamptz, now()))\n    on conflict (cid) do nothing;\n    n := n + 1;\n  end loop;\n  return n;\nend $$;\n\ncreate or replace function iso_write_photo(p json) returns void\nlanguage plpgsql security definer set search_path = public as $$\ndeclare me text := iso_me();\nbegin\n  if me is null then raise exception 'not allowed' using errcode = '42501'; end if;\n  if length(p->>'data') > 1500000 then raise exception 'photo too large'; end if;\n  insert into iso_photo(cid, fam, tub, who, note, thumb, data, at)\n  values (p->>'cid', iso_fam(), p->>'tub', me, left(p->>'note', 2000), p->>'thumb', p->>'data',\n          coalesce((p->>'at')::timestamptz, now()))\n  on conflict (cid) do nothing;\nend $$;\n\ncreate or replace function iso_remove(id text) returns void\nlanguage plpgsql security definer set search_path = public as $$\ndeclare me text := iso_me();\nbegin\n  if me is null then raise exception 'not allowed' using errcode = '42501'; end if;\n  if exists (\n    select 1 from iso_log l\n    where l.fam = iso_fam() and l.cid = id and l.who is distinct from me\n      and not (l.kind = 'dcmt' and exists (\n        select 1 from iso_log d where d.fam = l.fam\n          and d.cid = substring(l.tub from 3) and d.kind = 'diary' and d.who = me\n      ))\n  ) or exists (\n    select 1 from iso_photo p\n    where p.fam = iso_fam() and p.cid = id and p.who is distinct from me\n  ) then\n    raise exception 'record owner only' using errcode = '42501';\n  end if;\n  update iso_log set del = true, upd = now() where fam = iso_fam() and cid = id;\n  update iso_photo set del = true, upd = now() where fam = iso_fam() and cid = id;\nend $$;\n-- 예전 '비밀 링크' 함수는 막아요 (링크를 아는 사람도 더는 못 써요)\ndo $$ begin\n  revoke execute on function iso_pull(text, timestamptz) from public, anon, authenticated;\n  revoke execute on function iso_push(text, json) from public, anon, authenticated;\n  revoke execute on function iso_photo_add(text, json) from public, anon, authenticated;\n  revoke execute on function iso_photo_get(text, text) from public, anon, authenticated;\n  revoke execute on function iso_del(text, text) from public, anon, authenticated;\nexception when undefined_function then null; end $$;\n\nrevoke execute on function iso_fam() from public, anon, authenticated;\nrevoke execute on function iso_me() from public, anon, authenticated;\nrevoke execute on function iso_write(json) from public, anon;\nrevoke execute on function iso_write_photo(json) from public, anon;\nrevoke execute on function iso_remove(text) from public, anon;\ngrant execute on function iso_view(timestamptz) to anon, authenticated;\ngrant execute on function iso_view_photo(text) to anon, authenticated;\ngrant execute on function iso_whoami() to anon, authenticated;\ngrant execute on function iso_write(json) to authenticated;\ngrant execute on function iso_write_photo(json) to authenticated;\ngrant execute on function iso_remove(text) to authenticated;\n\n-- ===== 대표 사진 · 앨범 9칸 · 메모장 (v4) =====\n-- 0번 칸 = 대표 사진, 1~9번 칸 = 앨범. 교체하면 예전 사진은 서버에서 지워져요.\ncreate table if not exists iso_gal(\n  fam text not null,\n  tub text not null check (length(tub) <= 8),\n  slot int not null check (slot between -1 and 9),\n  thumb text not null,\n  data text not null,\n  who text,\n  upd timestamptz not null default now(),\n  primary key (fam, tub, slot)\n);\nalter table iso_gal enable row level security;\nalter table iso_gal drop constraint if exists iso_gal_slot_check;\nalter table iso_gal add constraint iso_gal_slot_check check (slot between -1 and 9);\ndrop function if exists iso_gal_swap(text, int, int);\n\n-- 목록 (누구나): 대표(0)와 앨범(1~9) 칸의 위치·시각, 미리보기는 since 이후 바뀐 칸만\ncreate or replace function iso_gal_list(since timestamptz default '1970-01-01')\nreturns json language sql stable security definer set search_path = public as $$\n  select coalesce(json_agg(json_build_object('tub', tub, 'slot', slot, 'who', who, 'upd', upd,\n           'thumb', case when upd > since then thumb end) order by tub, slot), '[]'::json)\n  from iso_gal where fam = iso_fam() and slot between 0 and 9;\n$$;\n\n-- 원본 사진 (누구나)\ncreate or replace function iso_gal_get(t text, s int) returns text\nlanguage sql stable security definer set search_path = public as $$\n  select data from iso_gal where fam = iso_fam() and tub = t and slot = s;\n$$;\n\n-- 올리기·교체 (등록된 계정만)\ncreate or replace function iso_gal_set(t text, s int, th text, d text) returns timestamptz\nlanguage plpgsql security definer set search_path = public as $$\ndeclare me text := iso_me(); u timestamptz := clock_timestamp();\nbegin\n  if me is null then raise exception 'not allowed' using errcode = '42501'; end if;\n  if s < 0 or s > 9 then raise exception 'bad slot'; end if;\n  if length(d) > 1000000 or length(th) > 120000 then raise exception 'photo too large'; end if;\n  insert into iso_gal(fam, tub, slot, thumb, data, who, upd) values (iso_fam(), t, s, th, d, me, u)\n  on conflict (fam, tub, slot) do update set thumb = excluded.thumb, data = excluded.data, who = excluded.who, upd = excluded.upd;\n  return u;\nend $$;\n\n-- 지우기 (등록된 계정만) — 서버에서 실제로 지워요\ncreate or replace function iso_gal_del(t text, s int) returns void\nlanguage plpgsql security definer set search_path = public as $$\nbegin\n  if iso_me() is null then raise exception 'not allowed' using errcode = '42501'; end if;\n  delete from iso_gal where fam = iso_fam() and tub = t and slot = s;\nend $$;\n\n-- 앨범 사진을 대표 사진(0번)으로 복사\ncreate or replace function iso_gal_cover(t text, s int) returns void\nlanguage plpgsql security definer set search_path = public as $$\ndeclare me text := iso_me(); f text := iso_fam();\nbegin\n  if me is null then raise exception 'not allowed' using errcode = '42501'; end if;\n  insert into iso_gal(fam, tub, slot, thumb, data, who, upd)\n  select fam, tub, 0, thumb, data, me, clock_timestamp() from iso_gal where fam = f and tub = t and slot = s\n  on conflict (fam, tub, slot) do update set thumb = excluded.thumb, data = excluded.data, who = excluded.who, upd = excluded.upd;\nend $$;\n\n-- 사육통마다 메모장 하나\ncreate table if not exists iso_memo(\n  fam text not null,\n  tub text not null check (length(tub) <= 8),\n  body text not null default '',\n  who text,\n  upd timestamptz not null default now(),\n  primary key (fam, tub)\n);\nalter table iso_memo enable row level security;\n\ncreate or replace function iso_memo_list(since timestamptz default '1970-01-01')\nreturns json language sql stable security definer set search_path = public as $$\n  select coalesce(json_agg(json_build_object('tub', tub, 'body', body, 'who', who, 'upd', upd)), '[]'::json)\n  from iso_memo where fam = iso_fam() and upd > since;\n$$;\n\ncreate or replace function iso_memo_set(t text, b text) returns timestamptz\nlanguage plpgsql security definer set search_path = public as $$\ndeclare me text := iso_me(); u timestamptz := clock_timestamp();\nbegin\n  if me is null then raise exception 'not allowed' using errcode = '42501'; end if;\n  if length(b) > 20000 then raise exception 'memo too long'; end if;\n  insert into iso_memo(fam, tub, body, who, upd) values (iso_fam(), t, coalesce(b, ''), me, u)\n  on conflict (fam, tub) do update set body = excluded.body, who = excluded.who, upd = excluded.upd;\n  return u;\nend $$;\n\nrevoke execute on function iso_gal_set(text, int, text, text) from public, anon;\nrevoke execute on function iso_gal_del(text, int) from public, anon;\nrevoke execute on function iso_gal_cover(text, int) from public, anon;\nrevoke execute on function iso_memo_set(text, text) from public, anon;\ngrant execute on function iso_gal_list(timestamptz) to anon, authenticated;\ngrant execute on function iso_gal_get(text, int) to anon, authenticated;\ngrant execute on function iso_gal_set(text, int, text, text) to authenticated;\ngrant execute on function iso_gal_del(text, int) to authenticated;\ngrant execute on function iso_gal_cover(text, int) to authenticated;\ngrant execute on function iso_memo_list(timestamptz) to anon, authenticated;\ngrant execute on function iso_memo_set(text, text) to authenticated;\n\n-- ===== 남은 용량 보기 (v5) =====\ncreate or replace function iso_usage() returns json\nlanguage sql stable security definer set search_path = public as $$\n  select json_build_object(\n    'db', pg_database_size(current_database()),\n    'gal', pg_total_relation_size('iso_gal'),\n    'log', pg_total_relation_size('iso_log') + pg_total_relation_size('iso_photo'),\n    'memo', pg_total_relation_size('iso_memo'),\n    'nphoto', (select count(*) from iso_gal),\n    'ndiary', (select count(*) from iso_log where kind = 'diary' and not del),\n    'nlog', (select count(*) from iso_log where kind <> 'diary' and not del));\n$$;\ngrant execute on function iso_usage() to anon, authenticated;\n\n-- ===== 기록하는 사람 이름 (v6) =====\n-- 기본 이름: 나 → 재빈, 아빠 → 철사맨 (이미 바꿨다면 아무 일도 안 해요)\nupdate iso_editor set name = '재빈' where name = '나';\nupdate iso_editor set name = '철사맨' where name = '아빠';\nupdate iso_log   set who = case who when '나' then '재빈' else '철사맨' end, upd = now() where who in ('나', '아빠');\nupdate iso_photo set who = case who when '나' then '재빈' else '철사맨' end, upd = now() where who in ('나', '아빠');\nupdate iso_gal   set who = case who when '나' then '재빈' else '철사맨' end, upd = now() where who in ('나', '아빠');\nupdate iso_memo  set who = case who when '나' then '재빈' else '철사맨' end, upd = now() where who in ('나', '아빠');\n\n-- 로그인한 가족이 설정에서 자기 이름을 바꿀 때 쓰는 함수 (지난 기록의 이름도 함께 바뀌어요)\ncreate or replace function iso_rename(n text) returns text\nlanguage plpgsql security definer set search_path = public as $$\ndeclare me text := iso_me(); nn text := btrim(coalesce(n, ''));\nbegin\n  if me is null then raise exception 'not allowed' using errcode = '42501'; end if;\n  if length(nn) < 1 or length(nn) > 12 then raise exception 'bad name'; end if;\n  if nn = me then return nn; end if;\n  if exists (select 1 from iso_editor where name = nn) then raise exception 'name taken'; end if;\n  update iso_editor set name = nn where lower(email) = lower(coalesce(auth.jwt()->>'email', ''));\n  update iso_log   set who = nn, upd = now() where who = me;\n  update iso_photo set who = nn, upd = now() where who = me;\n  update iso_gal   set who = nn, upd = now() where who = me;\n  update iso_memo  set who = nn, upd = now() where who = me;\n  return nn;\nend $$;\nrevoke execute on function iso_rename(text) from public, anon;\ngrant execute on function iso_rename(text) to authenticated;\n";
const SQL_NAME="-- ===== 기록하는 사람 이름 (v6) =====\n-- 기본 이름: 나 → 재빈, 아빠 → 철사맨 (이미 바꿨다면 아무 일도 안 해요)\nupdate iso_editor set name = '재빈' where name = '나';\nupdate iso_editor set name = '철사맨' where name = '아빠';\nupdate iso_log   set who = case who when '나' then '재빈' else '철사맨' end, upd = now() where who in ('나', '아빠');\nupdate iso_photo set who = case who when '나' then '재빈' else '철사맨' end, upd = now() where who in ('나', '아빠');\nupdate iso_gal   set who = case who when '나' then '재빈' else '철사맨' end, upd = now() where who in ('나', '아빠');\nupdate iso_memo  set who = case who when '나' then '재빈' else '철사맨' end, upd = now() where who in ('나', '아빠');\n\n-- 로그인한 가족이 설정에서 자기 이름을 바꿀 때 쓰는 함수 (지난 기록의 이름도 함께 바뀌어요)\ncreate or replace function iso_rename(n text) returns text\nlanguage plpgsql security definer set search_path = public as $$\ndeclare me text := iso_me(); nn text := btrim(coalesce(n, ''));\nbegin\n  if me is null then raise exception 'not allowed' using errcode = '42501'; end if;\n  if length(nn) < 1 or length(nn) > 12 then raise exception 'bad name'; end if;\n  if nn = me then return nn; end if;\n  if exists (select 1 from iso_editor where name = nn) then raise exception 'name taken'; end if;\n  update iso_editor set name = nn where lower(email) = lower(coalesce(auth.jwt()->>'email', ''));\n  update iso_log   set who = nn, upd = now() where who = me;\n  update iso_photo set who = nn, upd = now() where who = me;\n  update iso_gal   set who = nn, upd = now() where who = me;\n  update iso_memo  set who = nn, upd = now() where who = me;\n  return nn;\nend $$;\nrevoke execute on function iso_rename(text) from public, anon;\ngrant execute on function iso_rename(text) to authenticated;\n";
const SQL_USE="-- ===== 남은 용량 보기 (v5) =====\ncreate or replace function iso_usage() returns json\nlanguage sql stable security definer set search_path = public as $$\n  select json_build_object(\n    'db', pg_database_size(current_database()),\n    'gal', pg_total_relation_size('iso_gal'),\n    'log', pg_total_relation_size('iso_log') + pg_total_relation_size('iso_photo'),\n    'memo', pg_total_relation_size('iso_memo'),\n    'nphoto', (select count(*) from iso_gal),\n    'ndiary', (select count(*) from iso_log where kind = 'diary' and not del),\n    'nlog', (select count(*) from iso_log where kind <> 'diary' and not del));\n$$;\ngrant execute on function iso_usage() to anon, authenticated;\n";
const SQL_GAL="-- ===== 대표 사진 · 앨범 9칸 · 메모장 (v4) =====\n-- 0번 칸 = 대표 사진, 1~9번 칸 = 앨범. 교체하면 예전 사진은 서버에서 지워져요.\ncreate table if not exists iso_gal(\n  fam text not null,\n  tub text not null check (length(tub) <= 8),\n  slot int not null check (slot between -1 and 9),\n  thumb text not null,\n  data text not null,\n  who text,\n  upd timestamptz not null default now(),\n  primary key (fam, tub, slot)\n);\nalter table iso_gal enable row level security;\nalter table iso_gal drop constraint if exists iso_gal_slot_check;\nalter table iso_gal add constraint iso_gal_slot_check check (slot between -1 and 9);\ndrop function if exists iso_gal_swap(text, int, int);\n\n-- 목록 (누구나): 대표(0)와 앨범(1~9) 칸의 위치·시각, 미리보기는 since 이후 바뀐 칸만\ncreate or replace function iso_gal_list(since timestamptz default '1970-01-01')\nreturns json language sql stable security definer set search_path = public as $$\n  select coalesce(json_agg(json_build_object('tub', tub, 'slot', slot, 'who', who, 'upd', upd,\n           'thumb', case when upd > since then thumb end) order by tub, slot), '[]'::json)\n  from iso_gal where fam = iso_fam() and slot between 0 and 9;\n$$;\n\n-- 원본 사진 (누구나)\ncreate or replace function iso_gal_get(t text, s int) returns text\nlanguage sql stable security definer set search_path = public as $$\n  select data from iso_gal where fam = iso_fam() and tub = t and slot = s;\n$$;\n\n-- 올리기·교체 (등록된 계정만)\ncreate or replace function iso_gal_set(t text, s int, th text, d text) returns timestamptz\nlanguage plpgsql security definer set search_path = public as $$\ndeclare me text := iso_me(); u timestamptz := clock_timestamp();\nbegin\n  if me is null then raise exception 'not allowed' using errcode = '42501'; end if;\n  if s < 0 or s > 9 then raise exception 'bad slot'; end if;\n  if length(d) > 1000000 or length(th) > 120000 then raise exception 'photo too large'; end if;\n  insert into iso_gal(fam, tub, slot, thumb, data, who, upd) values (iso_fam(), t, s, th, d, me, u)\n  on conflict (fam, tub, slot) do update set thumb = excluded.thumb, data = excluded.data, who = excluded.who, upd = excluded.upd;\n  return u;\nend $$;\n\n-- 지우기 (등록된 계정만) — 서버에서 실제로 지워요\ncreate or replace function iso_gal_del(t text, s int) returns void\nlanguage plpgsql security definer set search_path = public as $$\nbegin\n  if iso_me() is null then raise exception 'not allowed' using errcode = '42501'; end if;\n  delete from iso_gal where fam = iso_fam() and tub = t and slot = s;\nend $$;\n\n-- 앨범 사진을 대표 사진(0번)으로 복사\ncreate or replace function iso_gal_cover(t text, s int) returns void\nlanguage plpgsql security definer set search_path = public as $$\ndeclare me text := iso_me(); f text := iso_fam();\nbegin\n  if me is null then raise exception 'not allowed' using errcode = '42501'; end if;\n  insert into iso_gal(fam, tub, slot, thumb, data, who, upd)\n  select fam, tub, 0, thumb, data, me, clock_timestamp() from iso_gal where fam = f and tub = t and slot = s\n  on conflict (fam, tub, slot) do update set thumb = excluded.thumb, data = excluded.data, who = excluded.who, upd = excluded.upd;\nend $$;\n\n-- 사육통마다 메모장 하나\ncreate table if not exists iso_memo(\n  fam text not null,\n  tub text not null check (length(tub) <= 8),\n  body text not null default '',\n  who text,\n  upd timestamptz not null default now(),\n  primary key (fam, tub)\n);\nalter table iso_memo enable row level security;\n\ncreate or replace function iso_memo_list(since timestamptz default '1970-01-01')\nreturns json language sql stable security definer set search_path = public as $$\n  select coalesce(json_agg(json_build_object('tub', tub, 'body', body, 'who', who, 'upd', upd)), '[]'::json)\n  from iso_memo where fam = iso_fam() and upd > since;\n$$;\n\ncreate or replace function iso_memo_set(t text, b text) returns timestamptz\nlanguage plpgsql security definer set search_path = public as $$\ndeclare me text := iso_me(); u timestamptz := clock_timestamp();\nbegin\n  if me is null then raise exception 'not allowed' using errcode = '42501'; end if;\n  if length(b) > 20000 then raise exception 'memo too long'; end if;\n  insert into iso_memo(fam, tub, body, who, upd) values (iso_fam(), t, coalesce(b, ''), me, u)\n  on conflict (fam, tub) do update set body = excluded.body, who = excluded.who, upd = excluded.upd;\n  return u;\nend $$;\n\nrevoke execute on function iso_gal_set(text, int, text, text) from public, anon;\nrevoke execute on function iso_gal_del(text, int) from public, anon;\nrevoke execute on function iso_gal_cover(text, int) from public, anon;\nrevoke execute on function iso_memo_set(text, text) from public, anon;\ngrant execute on function iso_gal_list(timestamptz) to anon, authenticated;\ngrant execute on function iso_gal_get(text, int) to anon, authenticated;\ngrant execute on function iso_gal_set(text, int, text, text) to authenticated;\ngrant execute on function iso_gal_del(text, int) to authenticated;\ngrant execute on function iso_gal_cover(text, int) to authenticated;\ngrant execute on function iso_memo_list(timestamptz) to anon, authenticated;\ngrant execute on function iso_memo_set(text, text) to authenticated;\n";

/* 사진 원본은 IndexedDB */
const IDB=(()=>{let db;const open=()=>db?Promise.resolve(db):new Promise((ok,no)=>{const r=indexedDB.open('isolog',2);r.onupgradeneeded=()=>{const d=r.result;if(!d.objectStoreNames.contains('ph'))d.createObjectStore('ph');if(!d.objectStoreNames.contains('kv'))d.createObjectStore('kv')};r.onsuccess=()=>{db=r.result;ok(db)};r.onerror=()=>no(r.error);r.onblocked=()=>no(new Error('blocked'))});
  const tx=(st,m,f)=>open().then(d=>new Promise((ok,no)=>{const t=d.transaction(st,m),s=t.objectStore(st),q=f(s);t.oncomplete=()=>ok(q&&q.result);t.onerror=()=>no(t.error);t.onabort=()=>no(t.error)}));
  return{get:k=>tx('ph','readonly',s=>s.get(k)),put:(k,v)=>tx('ph','readwrite',s=>s.put(v,k)),del:k=>tx('ph','readwrite',s=>s.delete(k)),

const AK='isoauth1';

async function authCall(grant,body){const r=await fetch(`${SB_URL}/auth/v1/token?grant_type=${grant}`,{method:'POST',headers:{apikey:SB_KEY,'Content-Type':'application/json'},body:JSON.stringify(body)});
  const j=await r.json().catch(()=>({}));if(!r.ok){const e=new Error(j.error_description||j.msg||j.message||('auth '+r.status));e.code=r.status;throw e}return j}
let refreshing=null;
async function token(){if(!AU)return null;if(Date.now()<AU.exp-60000)return AU.at;
  if(!refreshing)refreshing=authCall('refresh_token',{refresh_token:AU.rt}).then(j=>{setAU(j);return AU.at}).catch(e=>{if(e.code>=400&&e.code<500){AU=null;D.ed=null;saveAU();save()}return null}).finally(()=>{refreshing=null});
  return refreshing}

async function rpc(fn,args){const t=await token();const r=await fetch(`${SB_URL}/rest/v1/rpc/${fn}`,{method:'POST',headers:{apikey:SB_KEY,Authorization:'Bearer '+(t||SB_KEY),'Content-Type':'application/json'},body:JSON.stringify(args)});
  if(!r.ok){const t=await r.text();const e=new Error(t);e.code=r.status;e.nosql=r.status===404||/PGRST202|Could not find the function|does not exist/.test(t);throw e}return r.status===204?null:r.json()}
async function sync(manual){if(SY.busy||!BOOT)return;SY.busy=true;setSync('ing');
  try{

    for(const c of D.pendP.slice()){const m=D.photos[c];if(!m){D.pendP=D.pendP.filter(x=>x!==c);continue}const data=await IDB.get(c);if(!data){D.pendP=D.pendP.filter(x=>x!==c);continue}
      await rpc('iso_write_photo',{p:{cid:c,tub:m.tub,who:m.who,note:m.note||null,thumb:m.thumb,data,at:m.at}});D.pendP=D.pendP.filter(x=>x!==c);save()}
    for(const c of (D.pendDel||[]).slice()){await rpc('iso_remove',{id:c});D.pendDel=D.pendDel.filter(x=>x!==c);save()}
    }
    const r=await rpc('iso_view',{since:D.since||'1970-01-01T00:00:00Z'});
    if(r){(r.logs||[]).forEach(l=>{D.logs[l.cid]=Object.assign({},D.logs[l.cid]||{},l,{sv:1})});(r.photos||[]).forEach(p=>{D.photos[p.cid]=Object.assign({},D.photos[p.cid]||{},p,{sv:1})});

function hydrateDynamicAnimals(){Object.entries(D.memo||{}).forEach(([k,v])=>{if(!v||!v.body)return;try{const m=JSON.parse(v.body),id=m.id,isNewKey=k==='new:'+id,isCompactKey=k===id&&/^x[a-z0-9]{7}$/i.test(id||''),isAliasKey=k==='a'+String(id||'').slice(1)&&/^x[a-z0-9]{7}$/i.test(id||'');if((!isNewKey&&!isCompactKey&&!isAliasKey)||D.removed.includes(id))return;if(m.kind==='iso'){if(!XSP[id]){const sp=ISPC[m.speciesIndex]||ISPC[0];XSP[id]=m.generic?Object.assign({},ISPC[0],{kind:'iso',n:m.name,ln:'',env:'',generic:true}):Object.assign({},sp,{kind:'iso',n:m.name});IMG[id]=m.generic?'':(IMG[String(m.speciesIndex)]||IMG['0'])}if(!ALL.includes(id)){ALL.push(id);const sh=SHELF.find(x=>x.id===m.location)||SHELF[0];if(!sh.tubs.includes(id))sh.tubs.push(id)}}else if(m.kind==='pet'){if(!PETS[m.group]&&m.groupName){PETS[m.group]={n:m.groupName,full:m.groupName,e:m.groupEmoji||'🐾',unit:m.groupUnit||'마리',img:PETS.ham.img,ids:[]};if(typeof HUB!=='undefined'&&!HUB.some(x=>x.id===m.group))HUB.push({id:m.group,e:m.groupEmoji||'🐾',n:m.groupName})}if(!PETS[m.group])return;if(!XSP[id])XSP[id]={n:m.name,ln:'',env:'',roll:0,fam:m.group,hab:'',pet:m.group,stage:m.stage||undefined};const P=PETS[m.group];if(!P.ids.includes(id))P.ids.push(id);if(P.stages&&P.stages[m.stage]&&!P.stages[m.stage].ids.includes(id))P.stages[m.stage].ids.push(id);IMG[id]=P.img}if(m.location)D.memo['loc:'+id]={body:m.location,who:v.who,upd:v.upd}}catch(e){}})}

  v.innerHTML=`<img src="${g.thumb}" alt="사진"><p>${esc(tubNm(t))} · ${n?n+'번 사진':'대표 사진'}${g.who?' · '+esc(g.who):''} · ${dayLab(g.upd)}</p><p style="opacity:.7">화면을 누르면 닫혀요</p>`;v.onclick=()=>v.remove();document.body.appendChild(v);
  const x=await galFull(t,n);if(x&&v.isConnected)v.querySelector('img').src=x}
function galTap(t,n){const g=(D.gal[t]||{})[n];if(!canEdit()){if(g)galView(t,n);return}
  if(!g){galPick(t,n);return}  sheet(`<h3>📷 ${esc(tubNm(t))} · ${n}번 사진</h3><img src="${g.thumb}" alt="" style="width:100%;border-radius:10px;border:2px solid var(--ink)">
    <div class="gact"><button class="btn" id="gv">🔍 크게 보기</button><button class="btn" id="gr">🔄 바꾸기</button><button class="btn" id="gc">⭐ 대표 사진으로 쓰기</button><button class="btn" id="gd">🗑 지우기</button></div><div class="sbb"><button class="btn" data-x>닫기</button></div>`,s=>{
    s.querySelector('#gv').onclick=()=>{closeSheet();galView(t,n)};s.querySelector('#gr').onclick=()=>{closeSheet();galPick(t,n)};
    s.querySelector('#gc').onclick=()=>{closeSheet();galRun(rpc('iso_gal_cover',{t,s:n}),'⭐ 대표 사진으로 정했어요')};
    s.querySelector('#gd').onclick=()=>{if(confirm('이 사진을 지울까요? 서버에서도 지워져요.')){closeSheet();galRun(rpc('iso_gal_del',{t,s:n}),'🗑 사진을 지웠어요')}}})}
function covMenu(t){if(!needEdit())return;const c=covOf(t);if(!c){galPick(t,0);return}
  sheet(`<h3>📷 ${esc(tubNm(t))} · 대표 사진</h3><img src="${c.thumb}" alt="" style="width:100%;border-radius:10px;border:2px solid var(--ink)"><p class="mut" style="font-size:13px;margin:6px 0 0">선반·오늘 탭에 보이는 사진이에요. 앨범 사진을 대표로 쓰려면 앨범에서 사진을 눌러 "대표 사진으로 쓰기"를 고르세요.</p>
    <div class="gact"><button class="btn" id="cn">🔄 새 사진으로 바꾸기</button><button class="btn" id="cd">↩ 기본 사진으로</button></div><div class="sbb"><button class="btn" data-x>닫기</button></div>`,s=>{
    s.querySelector('#cn').onclick=()=>{closeSheet();galPick(t,0)};
    s.querySelector('#cd').onclick=()=>{if(confirm('대표 사진을 지우고 기본 사진으로 되돌릴까요?')){closeSheet();galRun(rpc('iso_gal_del',{t,s:0}),'↩ 기본 사진으로 되돌렸어요')}}})}
function galPick(t,n){if(!needEdit())return;const i=pickerInput();i.onchange=()=>{const f=i.files[0];if(!f)return;
  if(n===0){const done=busy('📷 사진을 여는 중… 잠시만요');decodeImg(f).then(im=>{done();cropSheet(t,im)}).catch(e=>{done();toast(photoErr(f,e))});return}
  toast('📷 사진을 올리는 중…');
  shrink(f,1024,.72).then(d=>shrink(f,360,.7).then(th=>galRun(rpc('iso_gal_set',{t,s:n,th,d}),n===0?'📷 대표 사진을 바꿨어요':'📷 사진을 올렸어요'))).catch(e=>toast(photoErr(f,e)))};i.click()}
async function galRun(p,ok){try{await p;await syncGal();toast(ok)}catch(e){toast(/too large/.test(e.message)?'⚠ 사진이 너무 커요':/not allowed/.test(e.message)?'🔒 기록 권한이 없어요':'⚠ 사진을 올리지 못했어요. 인터넷을 확인해 주세요')}
  if(CUR)refreshDetail();else render()}
/* --- 대표 사진 자르기: 끌어서 옮기고, 두 손가락·슬라이더로 확대 --- */
function cropSheet(t,im){const IW=im.width,IH=im.height;
  sheet(`<h3>✂️ ${esc(tubNm(t))} 대표 사진 맞추기</h3><p class="mut" style="margin:-4px 0 8px;font-size:13px">사진을 끌어서 옮기고, 두 손가락이나 아래 막대로 확대·축소하세요. 네모 안이 선반에 보이는 모습이에요.</p>
   <div class="crop" id="crop"><canvas></canvas><div class="cgrid"></div></div>
   <div class="row" style="flex-wrap:nowrap;margin-top:10px"><span>🔍</span><input id="cz" type="range" min="1" max="4" step="0.01" value="1" style="flex:1"><button class="btn sm" id="cfit">맞춤</button></div>
   <div class="sbb"><button class="btn" data-x>취소</button><button class="btn pri" id="cok">올리기</button></div>`,sh=>{
    const box=sh.querySelector('#crop'),cv=box.querySelector('canvas'),g=cv.getContext('2d'),zr=sh.querySelector('#cz');let W=0,H=0,base=1,z=1,x=0,y=0;
    const clamp=()=>{const s=base*z,w=IW*s,h=IH*s;x=Math.min(0,Math.max(W-w,x));y=Math.min(0,Math.max(H-h,y))};
    const draw=()=>{clamp();const d=devicePixelRatio||1;g.setTransform(d,0,0,d,0,0);g.clearRect(0,0,W,H);g.imageSmoothingQuality='high';g.drawImage(im,x,y,IW*base*z,IH*base*z)};
    const fit=()=>{W=box.clientWidth;H=box.clientHeight;const d=devicePixelRatio||1;cv.width=Math.round(W*d);cv.height=Math.round(H*d);cv.style.width=W+'px';cv.style.height=H+'px';base=Math.max(W/IW,H/IH);z=1;zr.value=1;x=(W-IW*base)/2;y=(H-IH*base)/2;draw()};
    const zoomAt=(nz,cx,cy)=>{nz=Math.max(1,Math.min(4,nz));const s0=base*z,s1=base*nz;x=cx-(cx-x)*s1/s0;y=cy-(cy-y)*s1/s0;z=nz;zr.value=z;draw()};
    const P=new Map();let last=null;
    box.addEventListener('pointerdown',e=>{box.setPointerCapture(e.pointerId);P.set(e.pointerId,{x:e.clientX,y:e.clientY});last=null});
    box.addEventListener('pointermove',e=>{if(!P.has(e.pointerId))return;const prev=P.get(e.pointerId);P.set(e.pointerId,{x:e.clientX,y:e.clientY});
      if(P.size===1){x+=e.clientX-prev.x;y+=e.clientY-prev.y;draw()}
      else if(P.size===2){const [a,b]=[...P.values()],r=box.getBoundingClientRect(),dist=Math.hypot(a.x-b.x,a.y-b.y),mx=(a.x+b.x)/2-r.left,my=(a.y+b.y)/2-r.top;
        if(last){x+=mx-last.mx;y+=my-last.my;zoomAt(z*dist/last.dist,mx,my)}last={dist,mx,my}}});
    const up=e=>{P.delete(e.pointerId);last=null};box.addEventListener('pointerup',up);box.addEventListener('pointercancel',up);
    box.addEventListener('wheel',e=>{e.preventDefault();const r=box.getBoundingClientRect();zoomAt(z*(e.deltaY<0?1.08:1/1.08),e.clientX-r.left,e.clientY-r.top)},{passive:false});
    zr.oninput=()=>zoomAt(+zr.value,W/2,H/2);sh.querySelector('#cfit').onclick=fit;
    requestAnimationFrame(fit);
    sh.querySelector('#cok').onclick=()=>{const s=base*z,sx=-x/s,sy=-y/s,sw=W/s,sh2=H/s;
      const out=(w,h,q)=>{const c=document.createElement('canvas');c.width=w;c.height=h;const cg=c.getContext('2d');cg.imageSmoothingQuality='high';cg.drawImage(im,sx,sy,sw,sh2,0,0,w,h);return c.toDataURL('image/jpeg',q)};
      const d=out(1024,768,.8),th=out(360,270,.72);closeSheet();toast('📷 사진을 올리는 중…');galRun(rpc('iso_gal_set',{t,s:0,th,d}),'📷 대표 사진을 바꿨어요')}})}
/* --- 저장 공간 (Supabase 무료 플랜 데이터베이스 500MB, 게임과 함께 씀) --- */
const DB_LIMIT=500*1024*1024;
const mb=b=>b>=1024*1024*100?Math.round(b/1048576)+'MB':(Math.round(b/1048576*10)/10)+'MB';
async function showUsage(){const box=$('#useBox');if(!box)return;let u;
  try{u=await rpc('iso_usage',{})}catch(e){if(box.isConnected)box.innerHTML=`<b>💾 저장 공간</b><p class="mut" style="margin:6px 0">${e.nosql?'남은 용량을 보려면 Supabase에서 아래 "용량 확인용 SQL"을 한 번 실행해 주세요.':'지금은 확인할 수 없어요. 인터넷 연결을 확인해 주세요.'}</p>${e.nosql?'<button class="btn sm" id="cpSqlUse">용량 확인용 SQL 복사</button>':''}`;if($('#cpSqlUse'))$('#cpSqlUse').onclick=()=>copy(SQL_USE,'📋 용량 확인용 SQL을 복사했어요');return}
  if(!box.isConnected)return;if(!u||typeof u.db!=='number'){box.innerHTML='<b>💾 저장 공간</b><p class="mut" style="margin:6px 0">지금은 확인할 수 없어요.</p>';return}u.nlog=u.nlog||0;u.ndiary=u.ndiary||0;u.nphoto=u.nphoto||0;u.gal=u.gal||0;u.log=u.log||0;u.memo=u.memo||0;
  const used=u.db,free=Math.max(0,DB_LIMIT-used),pct=Math.min(100,used/DB_LIMIT*100),mine=u.gal+u.log+u.memo,other=Math.max(0,used-mine);
  const slots=Object.keys(XSP).filter(id=>id!=='tt'&&!(D.removed||[]).includes(id)).length+activeALL().length,tot=slots*10,avg=u.nphoto?u.gal/u.nphoto:320*1024,reserve=Math.max(0,tot-u.nphoto)*avg;
  const left=Math.max(0,free-reserve),dia=Math.floor(left/1600),dia6=Math.floor(left/6500);
  const big=n=>n>=10000?`약 ${Math.floor(n/1000)/10}만`:`약 ${n.toLocaleString()}`;
  box.innerHTML=`<b>💾 저장 공간</b><div class="ubar"><i style="width:${pct.toFixed(1)}%"></i></div>
   <p style="margin:6px 0 2px"><b>${mb(used)}</b> / 500MB 사용 · <b>${mb(free)}</b> 남음</p>
   <div class="kv"><span>📷 사진 (대표·앨범)</span><span>${mb(u.gal)} · ${u.nphoto} / ${tot}장</span></div>
   <div class="kv"><span>📜 기록·📔 일지·📒 메모</span><span>${mb(u.log+u.memo)} · 기록 ${u.nlog.toLocaleString()} · 일지 ${u.ndiary.toLocaleString()}</span></div>
   <div class="kv"><span>🎮 게임·기본 시스템</span><span>${mb(other)}</span></div>
   <p class="mut" style="font-size:13px;margin:8px 0 0">사진 칸 ${tot}장을 모두 채워도 일지를 <b>${big(dia)} 개</b>(보통 길이) · 꽉 채운 2000자 일지라도 <b>${big(dia6)} 개</b> 더 쓸 수 있어요.</p>`}
/* --- 시작 --- */
boot().then(()=>{render();sync()});
setInterval(()=>{if(!document.hidden)sync()},45000);
addEventListener('focus',()=>sync());addEventListener('online',()=>sync());
</script>
