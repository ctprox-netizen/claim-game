<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>보험금 심사 게임 | 점검 중</title>
<style>
:root{color-scheme:light}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#f3f5f8;color:#202938;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
main{width:min(100%,520px);padding:40px 28px;text-align:center;background:#fff;border:1px solid #e3e8ef;border-radius:20px;box-shadow:0 12px 36px rgba(25,40,65,.08)}
.mark{width:56px;height:56px;margin:0 auto 22px;display:grid;place-items:center;border-radius:16px;background:#eef2f7;font-size:27px}
h1{margin:0 0 14px;font-size:25px;letter-spacing:-.04em}
p{margin:0;color:#667085;font-size:15px;line-height:1.8}
.status{display:inline-block;margin-top:26px;padding:8px 13px;border-radius:999px;background:#fff4df;color:#946200;font-size:13px;font-weight:700}
</style>
</head>
<body>
<main>
<div class="mark" aria-hidden="true">🛠️</div>
<h1>보험금 심사 게임</h1>
<p>현재 점검 중입니다.<br>더 나은 서비스 제공을 위해 개선 작업을 진행하고 있습니다.<br>이용에 불편을 드려 죄송합니다.</p>
<div class="status">점검 중</div>
</main>
</body>
</html>
