<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#f3f5f8">
<title>보험금 심사 게임 | 점검중</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
body{min-height:100vh;display:grid;place-items:center;padding:24px;background:#f3f5f8;color:#202938}
main{width:min(100%,520px);padding:40px 28px;text-align:center;background:#fff;border:1px solid #e3e8ef;border-radius:20px;box-shadow:0 12px 36px rgba(25,40,65,.08)}
.mark{font-size:42px;margin-bottom:14px}
h1{font-size:24px;margin:0 0 16px}
p{line-height:1.8;color:#667085;margin:0}
.status{display:inline-block;margin-top:22px;padding:8px 16px;border-radius:999px;background:#fff3d6;color:#946200;font-size:14px;font-weight:700}
#secret{position:fixed;z-index:10;top:0;right:0;width:54px;height:54px;touch-action:none;-webkit-user-select:none;user-select:none}
</style>
</head>
<body>
<main>
<div class="mark" aria-hidden="true">🛠️</div>
<h1>보험금 심사 게임</h1>
<p>현재 점검중입니다.<br>더 나은 서비스 제공을 위해 개선 작업을 진행하고 있습니다.<br>이용에 불편을 드려 죄송합니다.</p>
<div class="status">점검중</div>
</main>
<div id="secret" aria-hidden="true"></div>
<script>
(()=>{const zone=document.getElementById('secret');let timer=0,started=false;
const clear=()=>{if(timer)clearTimeout(timer);timer=0;started=false};
zone.addEventListener('contextmenu',e=>e.preventDefault());
zone.addEventListener('pointerdown',e=>{if(e.button!==0&&e.pointerType==='mouse')return;clear();started=true;timer=setTimeout(()=>{if(started)location.href='./private/';},5000);});
['pointerup','pointercancel','pointerleave','lostpointercapture'].forEach(type=>zone.addEventListener(type,clear));
})();
</script>
</body>
</html>
